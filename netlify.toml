# Configuración de Netlify
# La app es estática (publish ".") + funciones serverless en netlify/functions.
# Los secretos NO van aquí: se configuran como variables de entorno en Netlify
# (UI → Site configuration → Environment variables), con alcance "Functions".

[build]
  command = "npm install"
  publish = "."

[functions]
  directory = "netlify/functions"

# --- Cabeceras de seguridad --------------------------------------------------
# NO se ponen X-Frame-Options ni "frame-ancestors": eran la unica diferencia
# entre este sitio y el de GitHub Pages, que si se instala como app en Android.
# Protegen contra clickjacking, que en una app personal sin enlaces externos no
# es un riesgo real, y no compensa arriesgarse a que impidan la instalacion.
# Tampoco se pone una CSP completa: la app usa <style> y <script> en linea y
# carga fuentes y el cliente de Google, asi que una CSP estricta mal ajustada
# romperia los estilos o el login.
# Referrer-Policy si se mantiene: evita que la URL con la clave del flujo de
# conexion de Google se filtre a otros sitios por el encabezado Referer.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# --- No publicar archivos que solo sirven para construir ---------------------
# El sitio se publica desde la raíz, así que estos archivos quedarían
# descargables. No contienen secretos (todo sale de variables de entorno), pero
# no hay razón para servirlos. Los archivos estáticos tienen prioridad sobre las
# redirecciones, de ahí "force".
# OJO: no afecta a /.netlify/functions/*, que empieza por "/." y no por "/netlify/".
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README-SETUP.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

# Las pruebas tampoco hacen falta en el sitio publicado: solo se corren a mano.
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
