<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No encontrado — Rican's Sweets by Fany</title>
<meta name="robots" content="noindex">
<style>
  :root{ --black:#0B0B0C; --card:#17140F; --gold:#D4AF37; --gold-light:#F2CF6B; --cream:#F6F0E4; --cream-dim:#C9C0AC; --line:#332B1D; }
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 20% 0%, #17130d 0%, var(--black) 55%);
    color: var(--cream);
    font-family: 'Work Sans', system-ui, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .box{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:32px 24px; max-width:420px; }
  h1{ color:var(--gold-light); font-size:44px; margin:0 0 6px; }
  p{ color:var(--cream-dim); font-size:15px; line-height:1.55; margin:0 0 20px; }
  a{ display:inline-block; background:var(--gold); color:#0B0B0C; text-decoration:none; font-weight:600; padding:12px 22px; border-radius:12px; }
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Esa página no existe. Tus pedidos siguen guardados: vuelve al libro de pedidos.</p>
    <a href="/">Volver a la app</a>
  </div>
</body>
</html>
