<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rican's Sweets by Fany — Pedidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black: #0B0B0C;
    --card: #17140F;
    --card-2: #1E1A12;
    --gold: #D4AF37;
    --gold-light: #F2CF6B;
    --cream: #F6F0E4;
    --cream-dim: #C9C0AC;
    --urgent: #C1440E;
    --urgent-bg: #2A1710;
    --line: #332B1D;
    --radius: 18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(circle at 20% 0%, #17130d 0%, var(--black) 55%);
    color: var(--cream);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding-bottom: 100px;
  }
  header{
    padding: 24px 20px 18px;
    text-align:center;
    position:relative;
  }
  header .logo{
    width: 92px;
    height: 92px;
    border-radius: 50%;
    object-fit: cover;
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 0 4px var(--black), 0 8px 20px rgba(212,175,55,.25);
    margin-bottom: 10px;
  }
  header .eyebrow{
    font-size:11px;
    letter-spacing:.28em;
    text-transform:uppercase;
    color: var(--gold);
    opacity:.85;
  }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-optical-sizing:auto;
    font-size: 34px;
    margin: 4px 0 2px;
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 70%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:.01em;
  }
  header p.tag{
    margin:0;
    color: var(--cream-dim);
    font-size:13px;
  }
  .divider{
    height:1px;
    margin: 18px auto 0;
    max-width: 320px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity:.6;
  }

  main{ padding: 8px 16px 0; max-width: 560px; margin: 0 auto; }

  .summary{
    display:flex;
    gap:10px;
    margin: 14px 0 20px;
  }
  .summary .pill{
    flex:1;
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 12px 10px;
    text-align:center;
  }
  .summary .pill .num{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:700;
    color: var(--gold-light);
    display:block;
  }
  .summary .pill.alert .num{ color: var(--urgent); }
  .summary .pill .lbl{ font-size:11px; color:var(--cream-dim); text-transform:uppercase; letter-spacing:.06em; }

  .section-label{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.14em;
    color: var(--gold);
    margin: 22px 4px 10px;
    opacity:.8;
  }

  .order-card{
    position:relative;
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px 16px 14px;
    margin-bottom: 14px;
    border: 1px solid var(--line);
    overflow:hidden;
  }
  .order-card.urgent{
    border-color: var(--urgent);
    background: linear-gradient(180deg, var(--urgent-bg), var(--card) 60%);
  }
  /* scalloped ticket edge on the left, like a bakery order slip */
  .order-card::before{
    content:"";
    position:absolute;
    left:-1px; top:0; bottom:0;
    width:10px;
    background-image: radial-gradient(circle at 0 8px, transparent 5px, var(--black) 5.5px);
    background-size: 10px 16px;
    background-repeat: repeat-y;
  }
  .order-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    padding-left:8px;
  }
  .order-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:19px;
    color: var(--cream);
  }
  .order-phone{
    font-size:12.5px;
    color: var(--cream-dim);
    margin-top:2px;
  }
  .stamp{
    flex-shrink:0;
    width:52px; height:52px;
    border-radius:50%;
    border: 1.5px dashed var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    line-height:1;
    color: var(--gold-light);
    transform: rotate(-6deg);
  }
  .order-card.urgent .stamp{
    border-color: var(--urgent);
    color: #FF9268;
  }
  .stamp .d-num{ font-family:'Fraunces', serif; font-weight:700; font-size:17px; }
  .stamp .d-lbl{ font-size:8px; text-transform:uppercase; letter-spacing:.05em; }

  .order-info{
    padding-left:8px;
    margin-top:10px;
    font-size:14px;
    color: var(--cream);
    line-height:1.45;
    white-space:pre-wrap;
  }
  .order-meta{
    padding-left:8px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    border-top: 1px dashed var(--line);
    padding-top:10px;
  }
  .order-date{ font-size:12.5px; color: var(--gold-light); }
  .order-price{ font-family:'Fraunces', serif; font-weight:700; color: var(--gold-light); font-size:16px; }

  .order-actions{
    padding-left:8px;
    display:flex;
    gap:14px;
    margin-top:10px;
  }
  .order-actions button{
    background:none;
    border:none;
    color: var(--cream-dim);
    font-size:12.5px;
    font-family:'Work Sans', sans-serif;
    cursor:pointer;
    padding:4px 0;
    text-decoration: underline;
    text-underline-offset:3px;
  }
  .order-actions button.done{ color: var(--gold-light); }
  .order-actions button.del{ color: #C1440E; }

  .empty{
    text-align:center;
    color: var(--cream-dim);
    padding: 60px 20px;
    font-size:14px;
  }
  .empty .big{
    font-family:'Fraunces', serif;
    font-size:20px;
    color: var(--cream);
    display:block;
    margin-bottom:6px;
  }

  .fab{
    position:fixed;
    right:20px;
    bottom:24px;
    width:60px;height:60px;
    border-radius:50%;
    background: linear-gradient(160deg, var(--gold-light), var(--gold));
    border:none;
    color:#1a1305;
    font-size:30px;
    font-weight:700;
    box-shadow: 0 8px 24px rgba(212,175,55,.35);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index: 30;
  }
  .fab:active{ transform: scale(.94); }

  .sheet-backdrop{
    position:fixed; inset:0;
    background: rgba(0,0,0,.6);
    backdrop-filter: blur(2px);
    z-index: 40;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed;
    left:0; right:0; bottom:0;
    background: var(--card-2);
    border-top: 1px solid var(--gold);
    border-radius: 22px 22px 0 0;
    padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
    z-index: 41;
    transform: translateY(100%);
    transition: transform .3s cubic-bezier(.2,.8,.3,1);
    max-height: 88vh;
    overflow-y:auto;
  }
  .sheet.open{ transform: translateY(0); }
  .sheet h2{
    font-family:'Fraunces', serif;
    color: var(--gold-light);
    font-size:20px;
    margin: 0 0 16px;
    text-align:center;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block;
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color: var(--gold);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 12px;
    color: var(--cream);
    font-size:15px;
    font-family:'Work Sans', sans-serif;
  }
  .field input:focus, .field textarea:focus{
    outline: none;
    border-color: var(--gold);
  }
  .field textarea{ min-height:70px; resize:vertical; }
  .row2{ display:flex; gap:10px; }
  .row2 .field{ flex:1; }

  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .sheet-actions button{
    flex:1;
    padding: 14px 10px;
    border-radius: 12px;
    font-size:14px;
    font-weight:600;
    border:none;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .btn-cancel{ background: transparent; color: var(--cream-dim); border:1px solid var(--line) !important; }
  .btn-save{ background: linear-gradient(160deg, var(--gold-light), var(--gold)); color:#1a1305; }

  .notice{
    margin: 0 4px 6px;
    font-size:11.5px;
    color: var(--cream-dim);
    text-align:center;
    line-height:1.5;
  }
  .notice button.link{
    background:none;border:none;color:var(--gold-light);text-decoration:underline;cursor:pointer;font-size:11.5px;padding:0;
  }
  .gcal-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background: var(--card);
    border:1px solid var(--line);
    border-radius: 12px;
    padding: 10px 14px;
    font-size:12.5px;
    color: var(--cream-dim);
    margin-top:14px;
  }
  .gcal-bar.connected{ border-color: var(--gold); color: var(--gold-light); }
  .gcal-bar button.link{
    background:none;border:none;color:var(--gold-light);text-decoration:underline;cursor:pointer;font-size:12.5px;padding:0;
  }
</style>
